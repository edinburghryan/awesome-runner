<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1a237e">
  <title>Awesome Runner</title>
  <link rel="icon" type="image/png" href="img/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="img/icon-152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/icon-180.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Auth Screen -->
  <div id="auth-screen" class="auth-screen">
    <h1>Awesome Runner</h1>
    <p>Training planner for ultramarathons</p>
    <button id="google-signin-btn" class="btn-google">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign in with Google
    </button>
  </div>

  <!-- App -->
  <div class="app">

    <!-- Header -->
    <header class="app-header">
      <div class="header-top">
        <div class="header-title">Awesome Runner</div>
        <div class="header-actions">
          <button class="btn-icon" id="btn-theme" title="Toggle dark mode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5h4"/><path d="M20 3v4"/><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg></button>
          <button class="btn-icon" id="btn-settings" title="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg></button>
          <button class="btn-icon" id="week-today" title="Go to this week"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14v2.2l1.6 1"/><path d="M16 2v4"/><path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"/><path d="M3 10h5"/><path d="M8 2v4"/><circle cx="16" cy="16" r="6"/></svg></button>
        </div>
      </div>
      <div id="race-countdown" class="race-countdown hidden"></div>
    </header>

    <!-- Main Content -->
    <main class="app-main">

      <!-- My Week Page -->
      <div id="page-week" class="page active">
        <div class="week-nav">
          <button class="btn-nav" id="week-prev">‹</button>
          <div id="week-nav-label" class="week-nav-label" style="position:relative;cursor:pointer;">This Week</div>
          <button class="btn-nav" id="week-next">›</button>
        </div>
        <div id="week-days"></div>
      </div>

      <!-- Races Page -->
      <div id="page-races" class="page">
        <h2 style="font-size:18px;font-weight:700;margin-bottom:16px;">Races</h2>
        <div id="races-list"></div>
        <button class="btn-add-race" id="btn-add-race">+ Add Race</button>
      </div>

    </main>

    <!-- Tab Bar -->
    <nav class="tab-bar" id="tab-bar">
      <button class="tab-btn active" data-page="week">
        <span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
        My Week
      </button>
      <button class="tab-btn" data-page="races">
        <span class="tab-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg></span>
        Races
      </button>
    </nav>
  </div>

  <!-- Workout Detail Modal -->
  <div class="modal-overlay hidden" id="workout-detail-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="workout-detail-title">Workout</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="workout-detail-body"></div>
    </div>
  </div>

  <!-- Add Workout Sheet -->
  <div class="modal-overlay hidden" id="add-workout-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Add Workout</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="add-workout-types">
          <button class="add-type-btn strength" onclick="App.addCustomWorkout('strength')">
            <span class="type-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.409 13.017A5 5 0 0 1 22 15c0 3.866-4 7-9 7-4.077 0-8.153-.82-10.371-2.462-.426-.316-.631-.832-.62-1.362C2.118 12.723 2.627 2 10 2a3 3 0 0 1 3 3 2 2 0 0 1-2 2c-1.105 0-1.64-.444-2-1"/><path d="M15 14a5 5 0 0 0-7.584 2"/><path d="M9.964 6.825C8.019 7.977 9.5 13 8 15"/></svg></span>Strength
          </button>
          <button class="add-type-btn yoga" onclick="App.addCustomWorkout('yoga')">
            <span class="type-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M22.063,8.226a7.976,7.976,0,0,0-5.521.63,10.063,10.063,0,0,0-3.986-5.687,1,1,0,0,0-1.112,0A10.072,10.072,0,0,0,7.457,8.858a7.964,7.964,0,0,0-5.521-.632,1,1,0,0,0-.732.769,10.771,10.771,0,0,0,2.481,9.149C6.036,20.781,8.873,21,11.816,21h.356c2.947,0,5.786-.219,8.14-2.855A10.764,10.764,0,0,0,22.8,8.994,1,1,0,0,0,22.063,8.226ZM12,5.245a8.36,8.36,0,0,1,2.772,4.73,9.256,9.256,0,0,0-1.089,1.017A10.3,10.3,0,0,0,12,13.515a10.345,10.345,0,0,0-1.687-2.523A9.314,9.314,0,0,0,9.227,9.98,8.362,8.362,0,0,1,12,5.245ZM10.958,18.992c-2.272-.05-4.173-.376-5.78-2.179A8.762,8.762,0,0,1,3.06,10.04a6.63,6.63,0,0,1,5.762,2.341A8.768,8.768,0,0,1,10.958,18.992Zm7.861-2.179c-1.61,1.8-3.513,2.129-5.789,2.179a8.759,8.759,0,0,1,2.138-6.61,6.808,6.808,0,0,1,5.011-2.393,5.528,5.528,0,0,1,.761.052A8.755,8.755,0,0,1,18.819,16.813Z"/></svg></span>Yoga
          </button>
          <button class="add-type-btn cycling" onclick="App.addCustomWorkout('cycling')">
            <span class="type-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg></span>Cycling
          </button>
          <button class="add-type-btn hiking" onclick="App.addCustomWorkout('hiking')">
            <span class="type-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/><path d="M16 17h4"/><path d="M4 13h4"/></svg></span>Hiking
          </button>
          <button class="add-type-btn canicross" onclick="App.addCustomWorkout('canicross')">
            <span class="type-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg></span>Canicross
          </button>
        </div>
        <div class="reference-workouts-header">From reference plan</div>
        <div id="reference-workouts-list"></div>
      </div>
    </div>
  </div>

  <!-- Race Form Modal -->
  <div class="modal-overlay hidden" id="race-form-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="race-form-title">Add Race</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Race Name</label>
          <input type="text" id="race-name" placeholder="e.g. Devil o' The Highlands">
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="race-date">
        </div>
        <div class="form-group">
          <label>Type</label>
          <select id="race-type">
            <option value="5k">5K</option>
            <option value="10k">10K</option>
            <option value="half_marathon">Half Marathon</option>
            <option value="marathon">Marathon</option>
            <option value="ultra" selected>Ultra</option>
          </select>
        </div>
        <div class="form-group">
          <label>Distance (km)</label>
          <input type="number" id="race-distance" placeholder="e.g. 68">
        </div>
        <div class="form-group">
          <label>Notes</label>
          <textarea class="notes-field" id="race-notes" placeholder="Optional notes..."></textarea>
        </div>
        <button class="btn-primary" id="race-form-save">Save</button>
        <button class="btn-danger hidden" id="race-form-delete">Delete Race</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay hidden" id="settings-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Settings</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Current reference plan week (1-23)</label>
          <input type="number" id="settings-ref-week" min="1" max="23" value="1">
          <p style="font-size:11px;color:var(--text-muted);margin-top:4px;">Sets which week of the 80/20 plan maps to this week. Auto-advances from here.</p>
          <p id="settings-end-date" style="font-size:12px;color:var(--primary);margin-top:8px;font-weight:500;"></p>
        </div>
        <button class="btn-primary" id="settings-save">Save</button>
        <div class="settings-row" style="margin-top:16px;">
          <span class="settings-label">Sign out</span>
          <button class="btn-icon" onclick="firebase.auth().signOut();location.reload();" style="font-size:13px;width:auto;padding:4px 12px;border:1px solid var(--border);border-radius:6px;">Sign out</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Day Colour Picker Modal -->
  <div class="modal-overlay hidden" id="colour-modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>Choose Colour</h3>
        <button class="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="colour-grid" id="colour-grid"></div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/reference-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/races.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => { Races.init(); });
  </script>
</body>
</html>
